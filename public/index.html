<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicatifs téléphoniques</title>
<style>
  :root {
    --papier: #f2f4ef;
    --encre: #1b2a2f;
    --discret: #5d6b6f;
    --trait: #d3d9d2;
    --code: #0e6b63;
    --survol: #e4ebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papier: #14201f;
      --encre: #e8eee8;
      --discret: #93a29d;
      --trait: #2a3a38;
      --code: #6fd6c8;
      --survol: #1c2c2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--papier);
    color: var(--encre);
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sous-titre { color: var(--discret); margin: 0 0 24px; }
  .recherche {
    position: sticky; top: 0; z-index: 1;
    background: var(--papier);
    padding: 12px 0;
    border-bottom: 2px solid var(--encre);
  }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 10px 12px;
    color: var(--encre);
    background: transparent;
    border: 1px solid var(--trait);
    border-radius: 4px;
  }
  input:focus-visible { outline: 2px solid var(--code); outline-offset: 1px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button {
    display: grid;
    grid-template-columns: 2rem 1fr auto;
    gap: 14px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--trait);
    padding: 11px 6px;
    cursor: pointer;
  }
  li button:hover, li button:focus-visible { background: var(--survol); outline: none; }
  .drapeau { font-size: 1.4rem; }
  .indicatif {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--code);
    font-variant-numeric: tabular-nums;
  }
  .vide { padding: 32px 6px; color: var(--discret); }
  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%);
    background: var(--encre); color: var(--papier);
    padding: 8px 16px; border-radius: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }
  .toast.visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Indicatifs téléphoniques</h1>
  <p class="sous-titre" id="compteur">Chargement…</p>

  <div class="recherche">
    <input id="q" type="search" placeholder="Chercher un pays ou un indicatif (ex. France, 33)" autocomplete="off" aria-label="Rechercher">
  </div>

  <ul id="liste"></ul>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const liste = document.getElementById("liste");
const compteur = document.getElementById("compteur");
const champ = document.getElementById("q");
const toast = document.getElementById("toast");
let minuteur, attente;

const drapeau = (code) =>
  [...code].map((c) => String.fromCodePoint(127397 + c.charCodeAt(0))).join("");

function afficher(pays) {
  compteur.textContent = pays.length + " pays et territoires";
  if (!pays.length) {
    liste.innerHTML = '<li class="vide">Aucun résultat. Essaie un autre nom ou un autre indicatif.</li>';
    return;
  }
  liste.innerHTML = pays.map((p) => `
    <li><button type="button" data-ind="${p.indicatif}" data-nom="${p.nom.replace(/"/g, "&quot;")}">
      <span class="drapeau" aria-hidden="true">${drapeau(p.code)}</span>
      <span>${p.nom}</span>
      <span class="indicatif">${p.indicatif}</span>
    </button></li>`).join("");
}

async function charger(q = "") {
  try {
    const r = await fetch("/api/pays?q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error(r.status);
    afficher(await r.json());
  } catch (e) {
    compteur.textContent = "Impossible de charger la liste. Vérifie que le serveur tourne.";
  }
}

champ.addEventListener("input", () => {
  clearTimeout(attente);
  attente = setTimeout(() => charger(champ.value), 150);
});

liste.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  try {
    await navigator.clipboard.writeText(b.dataset.ind);
    toast.textContent = b.dataset.ind + " copié";
  } catch {
    toast.textContent = "Copie impossible";
  }
  toast.classList.add("visible");
  clearTimeout(minuteur);
  minuteur = setTimeout(() => toast.classList.remove("visible"), 1200);
});

charger();
</script>
</body>
</html>
