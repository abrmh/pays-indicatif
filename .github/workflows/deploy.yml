name: CI/CD
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: SonarQube scan
        run: |
          docker run --rm \
            -e SONAR_HOST_URL=http://host.docker.internal:9000 \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.qualitygate.wait=true

      - name: Build
        run: docker build -t pays-indicatifs:${{ github.sha }} .

      - name: Deploy
        run: TAG=${{ github.sha }} docker stack deploy --resolve-image never -c docker-stack.yml pays
